name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests · ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Prokron has no dependencies and no build step. If this ever needs a
      # package installed, something has gone wrong with ADR-016.
      - name: Unit suite
        run: python -m unittest discover -s tests

      - name: Installer suite
        run: sh tests/install.sh

  invariants:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The chronicle is authority. If it does not validate, nothing derived
      # from it means anything.
      - name: Authority is consistent
        run: .prokron/prokron validate

      # Gate B and AC-T-P2-14-01 both claim the compiled directory is
      # reproducible from authority alone. This is that claim, enforced: delete
      # it, rebuild it, and fail on any difference from what was committed.
      - name: Compiled output regenerates byte for byte
        run: |
          rm -rf .prokron/compiled
          .prokron/prokron compile
          .prokron/prokron graph
          .prokron/prokron dashboard
          if ! git diff --quiet --exit-code -- .prokron/compiled; then
            echo "::error::Compiled output differs from what is committed."
            echo "Run: rm -rf .prokron/compiled && prokron compile && prokron graph && prokron dashboard"
            git diff --stat -- .prokron/compiled
            exit 1
          fi

      # A generated file that someone edited by hand is authority pretending to
      # be output. The header exists to make that visible.
      - name: Generated files still declare themselves generated
        run: |
          for file in .prokron/compiled/README.md .prokron/compiled/STATE.md .prokron/compiled/TASK_GRAPH.md; do
            grep -Fq 'Generated by `prokron compile`' "$file" || {
              echo "::error::$file lost its generated-by header"
              exit 1
            }
          done

  runtime-boundary:
    name: no network, no dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ADR-016: the runtime is standard library only. An import that reaches
      # outside it should fail here rather than in someone's repository.
      - name: Runtime imports only the standard library
        run: |
          python - <<'PY'
          import pathlib, sys, ast
          stdlib = set(sys.stdlib_module_names)
          offenders = []
          for path in sorted(pathlib.Path("src/prokron").glob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [] if node.level else [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in stdlib and name != "prokron":
                          offenders.append(f"{path.name}: {name}")
          if offenders:
              print("::error::runtime imports outside the standard library")
              print("\n".join(offenders))
              raise SystemExit(1)
          print("clean")
          PY
